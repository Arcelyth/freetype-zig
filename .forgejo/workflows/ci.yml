name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: codeberg-small
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils libc6-dev libfreetype6-dev pkg-config fonts-dejavu-core

      - name: Install Zig 0.17.0
        run: |
          curl --fail --show-error --location --retry 3 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz --output /tmp/zig.tar.xz
          # Checksum from https://ziglang.org/download/index.json
          echo '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  /tmp/zig.tar.xz' | sha256sum --check
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz --strip-components=1 -C /tmp/zig
          /tmp/zig/zig version

      - name: Test
        run: /tmp/zig/zig build test --summary all
